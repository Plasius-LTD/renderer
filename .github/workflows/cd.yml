name: CD (Retire legacy npm package)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Enter RETIRE @plasius/renderer to deprecate every published version"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: retire-legacy-renderer
  cancel-in-progress: false

jobs:
  deprecate:
    name: Deprecate all published versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Validate explicit retirement confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [ "${CONFIRMATION}" != 'RETIRE @plasius/renderer' ]; then
            echo "Exact retirement confirmation was not supplied." >&2
            exit 1
          fi

      - name: Use Node.js 24 for registry administration
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Deprecate and verify every immutable registry version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_NAME: "@plasius/renderer"
          DEPRECATION_MESSAGE: "Retired permanently. Migrate to @plasius/gpu-renderer; Three.js is prohibited and is not a fallback."
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "The approved registry administration credential is unavailable." >&2
            exit 1
          fi

          npm deprecate "${PACKAGE_NAME}@*" "${DEPRECATION_MESSAGE}"

          VERSIONS="$(npm view "${PACKAGE_NAME}" versions --json | node -e '
            let input = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", (chunk) => { input += chunk; });
            process.stdin.on("end", () => {
              const parsed = JSON.parse(input);
              const versions = Array.isArray(parsed) ? parsed : [parsed];
              for (const version of versions.filter(Boolean)) console.log(version);
            });
          ')"
          if [ -z "${VERSIONS}" ]; then
            echo "No published versions were returned for verification." >&2
            exit 1
          fi

          while IFS= read -r VERSION; do
            ACTUAL="$(npm view "${PACKAGE_NAME}@${VERSION}" deprecated || true)"
            if [ "${ACTUAL}" != "${DEPRECATION_MESSAGE}" ]; then
              echo "Published version ${VERSION} did not retain the required deprecation notice." >&2
              exit 1
            fi
            echo "Verified deprecation metadata for ${PACKAGE_NAME}@${VERSION}."
          done <<< "${VERSIONS}"
