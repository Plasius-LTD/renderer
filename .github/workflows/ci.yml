name: Retirement CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  trusted_head:
    name: Trusted head admission
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Reject external fork execution
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "pull_request" ] && [ "${HEAD_REPOSITORY}" != "${BASE_REPOSITORY}" ]; then
            echo "External fork pull requests cannot execute repository retirement administration." >&2
            exit 1
          fi

  validate_retirement:
    name: Validate retirement administration
    needs: trusted_head
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify the one-purpose production workflow
        run: |
          set -euo pipefail
          FILE=.github/workflows/cd.yml
          grep -Fq 'environment: production' "${FILE}"
          grep -Fq 'npm deprecate' "${FILE}"
          grep -Fq 'secrets.NPM_TOKEN' "${FILE}"
          grep -Fq 'RETIRE @plasius/renderer' "${FILE}"
          if grep -Fq 'npm publish' "${FILE}"; then
            echo "The retirement workflow must not contain a package publish path." >&2
            exit 1
          fi
          if grep -Rq 'pull_request_target' .github/workflows; then
            echo "Retirement workflows must not use pull_request_target." >&2
            exit 1
          fi
