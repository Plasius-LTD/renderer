name: Retirement integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate_retired_tree:
    name: Validate documentation-only retirement
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Reject executable package material and active guidance
        run: |
          set -euo pipefail

          ALLOWED='^(\.github/workflows/ci\.yml|README\.md|CHANGELOG\.md|docs/RETIREMENT\.md|CODE_OF_CONDUCT\.md|CONTRIBUTORS\.md|LICENSE|SECURITY\.md|legal/(CLA|CORPORATE_CLA|INDIVIDUAL_CLA)\.md)$'
          UNEXPECTED="$(git ls-files | grep -Ev "${ALLOWED}" || true)"
          if [ -n "${UNEXPECTED}" ]; then
            echo "The retired repository contains files outside the documentation/legal inventory:" >&2
            printf '%s\n' "${UNEXPECTED}" >&2
            exit 1
          fi

          for FORBIDDEN in package.json package-lock.json src tests demo scripts dist node_modules .npmrc .npmignore; do
            if git ls-files "${FORBIDDEN}" "${FORBIDDEN}/**" | grep -q .; then
              echo "Retired package material remains: ${FORBIDDEN}" >&2
              exit 1
            fi
          done

          grep -Fq '# `@plasius/renderer` — permanently retired' README.md
          grep -Fq '@plasius/gpu-renderer' README.md
          grep -Fq '@plasius/gpu-lighting' README.md
          grep -Fq '@plasius/gpu-performance' README.md
          grep -Fq 'No runtime tombstone or compatibility shim will be released.' docs/RETIREMENT.md
          grep -Fq 'Three.js is prohibited and is not a fallback.' docs/RETIREMENT.md
